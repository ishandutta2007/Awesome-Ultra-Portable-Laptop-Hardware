<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #a5b4fc; }
    
    /* Dynamic background animations */
    @keyframes pulse-orbit {
      0% { transform: rotate(0deg); opacity: 0.3; }
      50% { transform: rotate(180deg); opacity: 0.6; }
      100% { transform: rotate(360deg); opacity: 0.3; }
    }
    @keyframes float-pill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .anim-orbit { transform-origin: 950px 150px; animation: pulse-orbit 14s infinite linear; }
    .anim-pill-1 { animation: float-pill 4s ease-in-out infinite; }
    .anim-pill-2 { animation: float-pill 5s ease-in-out 1s infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.05">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V300 M200 0V300 M300 0V300 M400 0V300 M500 0V300 M600 0V300 M700 0V300 M800 0V300 M900 0V300 M1000 0V300 M1100 0V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Top Decorative Border Light -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#primary-glow)"/>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Positioned safely on right side) -->
  <g class="anim-orbit">
    <circle cx="950" cy="150" r="110" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 12" opacity="0.4"/>
    <circle cx="950" cy="150" r="160" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.3"/>
    <circle cx="1060" cy="150" r="8" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="840" cy="150" r="6" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <!-- Visual Hardware Silhouette Illustration on Right -->
  <g transform="translate(850, 75)">
    <!-- Laptop Chassis Base Glass Card -->
    <rect x="0" y="0" width="220" height="150" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    
    <!-- Animated Floating Feature Pills -->
    <g class="anim-pill-1" transform="translate(-40, 20)">
      <rect width="110" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="55" y="21" text-anchor="middle" class="badge-text">⚡ Coreboot</text>
    </g>
    
    <g class="anim-pill-2" transform="translate(130, 90)">
      <rect width="120" height="32" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
      <text x="60" y="21" text-anchor="middle" class="badge-text">🔧 Repairable</text>
    </g>

    <!-- Circuit Trace Lines -->
    <path d="M30 50 L80 50 L110 80 L170 80" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="30" cy="50" r="4" fill="#6366f1"/>
    <circle cx="170" cy="80" r="4" fill="#a855f7"/>
  </g>

  <!-- FOREGROUND TEXT & HEADINGS (Guaranteed Clean Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="220" height="28" rx="14" fill="url(#primary-glow)" opacity="0.2"/>
      <rect width="220" height="28" rx="14" fill="none" stroke="#818cf8" stroke-width="1"/>
      <text x="110" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">ULTRA-PORTABLE HARDWARE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title">💻 Awesome Ultra-Portable Laptops</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">Curated Commercial Ultrabooks &amp; Open-Source Hardware Projects</text>

    <!-- Key Feature Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: Linux First -->
      <g>
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="65" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🐧 Linux First</text>
      </g>
      <!-- Badge 2: Open Firmware -->
      <g transform="translate(142, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="75" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔓 Open Firmware</text>
      </g>
      <!-- Badge 3: Modular & Repairable -->
      <g transform="translate(304, 0)">
        <rect width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="85" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4ade80">🛠️ 100% Repairable</text>
      </g>
    </g>
  </g>
</svg>
